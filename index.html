<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProfitZone Admin Panel</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#080808;
 color:white;
}

header{
 background:#151515;
 padding:22px;
 border-bottom:2px solid gold;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:gold;
 font-size:27px;
 font-weight:bold;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:25px;
}

h1,h2{
 color:gold;
 margin-bottom:20px;
}

.card{
 background:#171717;
 border:1px solid gold;
 border-radius:12px;
 padding:25px;
 margin:20px 0;
}

input{
 width:100%;
 padding:15px;
 margin:10px 0;
 background:#222;
 border:1px solid gold;
 border-radius:8px;
 color:white;
 font-size:16px;
}

button{
 background:linear-gradient(45deg,#d99c00,#ffe66d);
 border:0;
 padding:13px 22px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
 margin:5px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:15px;
}

.stat{
 background:#171717;
 border:1px solid gold;
 padding:25px;
 text-align:center;
 border-radius:12px;
}

.stat h2{
 font-size:30px;
}

#adminPanel{
 display:none;
}

#message{
 color:#ff7777;
 margin-top:15px;
}

.table-wrap{
 overflow-x:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:450px;
}

td,th{
 border:1px solid #997700;
 padding:13px;
 text-align:left;
}

th{
 color:gold;
 background:#332700;
}

small{
 color:#aaa;
}

</style>
</head>

<body>

<header>
 <div class="logo">👑 ProfitZone</div>
 <div>ADMIN PANEL</div>
</header>

<div class="container">

<!-- ADMIN LOGIN -->

<div id="loginBox" class="card">

<h1>👑 Admin Login</h1>

<input
 id="adminEmail"
 type="email"
 placeholder="Admin Email">

<input
 id="adminPassword"
 type="password"
 placeholder="Admin Password">

<button onclick="adminLogin()">LOGIN</button>

<p id="message"></p>

</div>


<!-- ADMIN DASHBOARD -->

<div id="adminPanel">

<h1>Welcome Admin 👑</h1>

<div class="stats">

 <div class="stat">
  <h2 id="totalUsers">0</h2>
  <p>Total Users</p>
 </div>

 <div class="stat">
  <h2 id="totalPoints">0</h2>
  <p>Total Demo Points</p>
 </div>

 <div class="stat">
  <h2 id="totalTasks">0</h2>
  <p>Completed Tasks</p>
 </div>

</div>


<div class="card">

<h2>👥 Registered Users</h2>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Points</th>
<th>Tasks</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

</div>

<button onclick="loadUsers()">Refresh Users</button>

</div>


<div class="card">

<h2>📊 Website Information</h2>

<p>Website: ProfitZone</p>
<br>
<p>Platform: Online Tasks Demo</p>
<br>
<p>Status: Active</p>
<br>
<p>Payment System: Not Connected</p>

</div>

<button onclick="adminLogout()">LOGOUT</button>

</div>

</div>


<script>

// ADMIN LOGIN

function adminLogin(){

 let email=document
 .getElementById("adminEmail")
 .value.trim().toLowerCase();

 let password=document
 .getElementById("adminPassword")
 .value.trim();

 if(
 email==="admin@profitzone.demo" &&
 password==="PZAdmin2026"
 ){

  document.getElementById("loginBox")
  .style.display="none";

  document.getElementById("adminPanel")
  .style.display="block";

  loadUsers();

 }else{

  document.getElementById("message")
  .innerText="Invalid Email or Password!";

 }

}


// LOAD USERS

function loadUsers(){

 let users=[];
 let points=0;
 let tasks=0;

 for(let i=0;i<localStorage.length;i++){

  let key=localStorage.key(i);

  if(key && key.startsWith("pz_") && key!=="pzUser"){

   try{

    let user=JSON.parse(localStorage.getItem(key));

    if(user && user.email && user.name){

     users.push(user);

     points+=Number(user.balance)||0;

     tasks+=(user.completed||[]).length;

    }

   }catch(error){}

  }

 }

 document.getElementById("totalUsers")
 .innerText=users.length;

 document.getElementById("totalPoints")
 .innerText=points;

 document.getElementById("totalTasks")
 .innerText=tasks;

 let html="";

 users.forEach(user=>{

  html+=`
  <tr>
   <td>${escapeHTML(user.name)}</td>
   <td>${escapeHTML(user.email)}</td>
   <td>${Number(user.balance)||0}</td>
   <td>${(user.completed||[]).length}</td>
  </tr>
  `;

 });

 document.getElementById("userTable")
 .innerHTML=html ||
 "<tr><td colspan='4'>No users found</td></tr>";

}


// PROTECT TABLE OUTPUT

function escapeHTML(value){

 return String(value).replace(/[&<>"']/g,function(c){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];

 });

}


// LOGOUT

function adminLogout(){

 document.getElementById("adminPanel")
 .style.display="none";

 document.getElementById("loginBox")
 .style.display="block";

 document.getElementById("adminPassword")
 .value="";

}

</script>

</body>
</html>
